<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Plumbing CT Cape Town — Professional Plumber in Cape Town</title>
    <meta
      name="description"
      content="Professional plumber in Cape Town for plumbing leak detection, pipe repair, shower and tap installation, toilet installation, geyser installation, drain cleaning and water tank installation. Call or WhatsApp +27 71 793 3414."
    />
    <meta name="theme-color" content="#05455E" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The canonical link is added at runtime with the full page URL (src/lib/usePageMeta.ts). -->

    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X). Crawlers don't run JS, so these are site-wide.
         %VITE_SITE_URL% is the production address from .env; set it so preview images resolve. -->
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Apex Plumbing CT Cape Town" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:title" content="Apex Plumbing CT — Professional Plumbing Services in Cape Town" />
    <meta property="og:description" content="Leak detection, pipe repair, shower and tap installation, geyser installation, drain cleaning and water tank installation in Cape Town." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Apex Plumbing CT Cape Town — Professional Plumbing Services" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apex Plumbing CT — Professional Plumbing Services in Cape Town" />
    <meta name="twitter:description" content="Leak detection, pipe repair, shower and tap installation, geyser installation, drain cleaning and water tank installation in Cape Town." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Plumber",
        "name": "Apex Plumbing CT",
        "alternateName": "Apex Plumbing CT Cape Town",
        "description": "Professional plumbing services including leak detection, pipe repair, shower and tap installation, toilet installation, geyser installation, drain cleaning and water tank installation in Cape Town.",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/images/apex-logo.png",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "email": "apexplumbingct@gmail.com",
        "telephone": "+27 71 793 3414",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "8 Kings Road",
          "addressLocality": "Cape Town",
          "postalCode": "8005",
          "addressRegion": "Western Cape",
          "addressCountry": "ZA"
        },
        "areaServed": { "@type": "City", "name": "Cape Town" }
      }
    </script>

    <link rel="preload" href="/fonts/big-shoulders-normal-700-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/public-sans-normal-400-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-normal-400-600.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Paint the brand background before CSS/JS loads — no white flash. */
      html, body { background: #F3F9FB; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
